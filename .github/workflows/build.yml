name: Build vitacraft.suprx

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Remettre les vrais noms de fichiers
        shell: bash
        run: |
          for f in *\ 2.*; do
            [ -e "$f" ] || continue
            mv -n "$f" "${f% 2.*}.${f##* 2.}"
          done
          ls -l

      - name: Compiler
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Vérifier le .suprx
        run: ls -l build/vitacraft.suprx

      - name: Publier le .suprx
        uses: actions/upload-artifact@v4
        with:
          name: vitacraft-suprx
          path: build/vitacraft.suprx

      - name: Release (sur tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/vitacraft.suprx
